plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

dependencies {
    implementation 'com.google.errorprone:error_prone_annotations:2.11.0' // Pour les annotations ErrorProne
    implementation 'javax.annotation:javax.annotation-api:1.3.2'         // Pour javax.annotation.*

    // Comes with `android.compileOptions.coreLibraryDesugaringEnabled`
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.3'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    buildFeatures {
        buildConfig = true
    }

    namespace = "net.archethic.archethic_wallet"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_19
        targetCompatibility = JavaVersion.VERSION_19
        coreLibraryDesugaringEnabled true // Comes with `dependencies.coreLibraryDesugaring`
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_19
    }

    defaultConfig {
        applicationId = "net.archethic.archethic_wallet"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 28
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        buildConfigField "String", "INTERCOM_APP_ID", "\"${getDartDefine('INTERCOM_APP_ID')}\""
        buildConfigField "String", "INTERCOM_ANDROID_KEY", "\"${getDartDefine('INTERCOM_ANDROID_KEY')}\""
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            proguardFiles 'proguard-rules.pro'
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE.txt', 'META-INF/NOTICE.txt', 'META-INF/LICENSE', 'META-INF/NOTICE']
            pickFirsts += ['META-INF/atomicfu.kotlin_module', 'META-INF/proguard/coroutines.pro']
        }
    }

}

flutter {
    source = "../.."
}

import java.util.Base64

String getDartDefine(String key) {
    if (project.hasProperty('dart-defines')) {
        def encodedDartDefines = project.property('dart-defines')
    
        try {
            def keyValuePairsEncoded = encodedDartDefines.split(',')
            
            for (keyValuePairEncoded in keyValuePairsEncoded) {
                 def keyValuePairDecoded = new String(Base64.decoder.decode(keyValuePairEncoded))

                def parts = keyValuePairDecoded.split('=', 2) 
                if (parts.size() == 2) {
                    def currentKey = parts[0]
                    def value = parts[1]

                   if (currentKey == key) {
                        return value
                    }
                }
            }
        } catch (e) {
            println("Failed to decode dart-defines: $e")
        }
    }
    return ''
}